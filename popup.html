<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Classic Tetris</title>
    <link rel="icon" href="./icons/icon-32.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="extension-popup">
    <main class="shell" aria-label="Classic Tetris game">
      <section class="game-area" aria-label="Game board">
        <div class="board-frame">
          <canvas id="board" width="300" height="600" aria-label="Tetris board"></canvas>
          <div class="overlay" id="overlay">
            <p id="overlay-title">Classic Tetris</p>
            <button class="primary-btn" id="start-button" type="button">게임 시작</button>
          </div>
        </div>

        <div class="mobile-controls" aria-label="Touch controls">
          <button type="button" data-action="left" aria-label="왼쪽">◀</button>
          <button type="button" data-action="rotate" aria-label="회전">↻</button>
          <button type="button" data-action="right" aria-label="오른쪽">▶</button>
          <button type="button" data-action="drop" aria-label="하드 드롭">⤓</button>
        </div>
      </section>

      <aside class="side-panel" aria-label="Game status">
        <div class="brand">
          <div class="brand-title">
            <div>
              <h1>Tetris</h1>
              <p>Chrome Extension</p>
            </div>
            <button class="help-button" id="help-button" type="button" aria-haspopup="dialog">
              도움말
            </button>
          </div>
        </div>

        <section class="panel-block preview-block" aria-label="Next piece">
          <div class="panel-heading">
            <h2>다음</h2>
          </div>
          <canvas id="next" width="120" height="120" aria-label="Next piece preview"></canvas>
        </section>

        <section class="panel-block preview-block" aria-label="Hold piece">
          <div class="panel-heading">
            <h2>보관</h2>
          </div>
          <canvas id="hold" width="120" height="120" aria-label="Hold piece preview"></canvas>
        </section>

        <section class="panel-block stats" aria-label="Score">
          <div>
            <span>점수</span>
            <strong id="score">0</strong>
          </div>
          <div>
            <span>최고</span>
            <strong id="best-score">0</strong>
          </div>
          <div>
            <span>라인</span>
            <strong id="lines">0</strong>
          </div>
          <div>
            <span>레벨</span>
            <strong id="level">1</strong>
          </div>
        </section>

        <section class="panel-block commands" aria-label="Commands">
          <button type="button" id="pause-button">일시정지</button>
          <button type="button" id="restart-button">새 게임</button>
        </section>

        <section class="panel-block settings" aria-label="Settings">
          <div class="mode-setting" aria-label="Game mode">
            <span>모드</span>
            <div class="mode-control" role="group" aria-label="Game mode">
              <button type="button" data-mode="classic" aria-pressed="true">기본</button>
              <button type="button" data-mode="sprint" aria-pressed="false">40라인</button>
            </div>
          </div>
          <label class="toggle-row" for="ghost-toggle">
            <span>착지 위치</span>
            <input id="ghost-toggle" type="checkbox" />
          </label>
          <label class="toggle-row" for="sound-toggle">
            <span>효과음</span>
            <input id="sound-toggle" type="checkbox" checked />
          </label>
        </section>

        <section class="panel-block keymap" aria-label="Keyboard controls">
          <div><kbd>←</kbd><span>왼쪽</span></div>
          <div><kbd>→</kbd><span>오른쪽</span></div>
          <div><kbd>↓</kbd><span>소프트 드롭</span></div>
          <div><kbd>Space</kbd><span>하드 드롭</span></div>
          <div><kbd>↑</kbd><span>회전</span></div>
          <div><kbd>C</kbd><span>보관</span></div>
        </section>
      </aside>
    </main>

    <dialog class="help-dialog" id="help-dialog" aria-labelledby="help-title">
      <div class="help-panel">
        <div class="help-header">
          <h2 id="help-title">조작법</h2>
          <button class="icon-button" id="help-close-button" type="button" aria-label="닫기">×</button>
        </div>
        <div class="help-keymap" aria-label="Keyboard controls">
          <div><kbd>←</kbd><span>왼쪽</span></div>
          <div><kbd>→</kbd><span>오른쪽</span></div>
          <div><kbd>↓</kbd><span>소프트 드롭</span></div>
          <div><kbd>Space</kbd><span>하드 드롭</span></div>
          <div><kbd>↑</kbd><span>회전</span></div>
          <div><kbd>C</kbd><span>보관</span></div>
          <div><kbd>P</kbd><span>일시정지</span></div>
          <div><kbd>Esc</kbd><span>일시정지</span></div>
        </div>
      </div>
    </dialog>

    <script src="./script.js"></script>
    <script src="./popup.js"></script>
  </body>
</html>
